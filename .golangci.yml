# Keeps the default linter set. These are the only two departures from it.
version: "2"

linters:
  settings:
    staticcheck:
      # golangci-lint's default set, plus -QF1012. WriteString(fmt.Sprintf(...))
      # is a style quick fix, not a defect.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1012
  exclusions:
    rules:
      # A bare receive from a chan error is a deliberate wait, usually for a
      # process that was just killed. Calls that drop an error still fail.
      - linters:
          - errcheck
        source: '^\s*(case\s+|defer func\(\) \{ _ = \S+; )?<-[\w.]+(:| \}\(\))?\s*(//.*)?$'
