# The default linter set, plus linters that catch unused parameters,
# conversions, copied code, and complex functions. The departures are below.
#
# gocognit and nestif hold the line on complexity. A function over either limit
# is split, not exempted. The one exception is internal/avmsim's opcode dispatch
# loop, which carries a nolint stating its reason. nolintlint fails any nolint
# that names no linter, gives no reason, or is no longer needed.
version: "2"

linters:
  enable:
    - unparam
    - unconvert
    - dupl
    - nolintlint # every nolint names its linter and gives a reason; unused nolints fail
    - gocognit
    - nestif
  settings:
    gocognit:
      min-complexity: 60
    nestif:
      min-complexity: 8
    dupl:
      threshold: 150
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      # golangci-lint's default set, plus -QF1012. WriteString(fmt.Sprintf(...))
      # is a style quick fix, not a defect.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1012
  exclusions:
    rules:
      # A bare receive from a chan error is a deliberate wait, usually for a
      # process that was just killed. Calls that drop an error still fail.
      - linters:
          - errcheck
        source: '^\s*(case\s+|defer func\(\) \{ _ = \S+; )?<-[\w.]+(:| \}\(\))?\s*(//.*)?$'
      # Test helpers that always get the same argument read better with it
      # named, and long or repeated table tests are normal.
      - path: _test\.go
        linters:
          - unparam
          - dupl
          - gocognit
          - nestif
      # Stat_t.Nlink's type depends on the platform.
      - path: internal/storeperm/linkcount_unix\.go
        linters:
          - unconvert
