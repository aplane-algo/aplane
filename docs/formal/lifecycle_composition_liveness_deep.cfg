\* Deep-bounds variant for make formal-test-deep (pre-release / scheduled
\* runs; not CI push). Metrics recorded in metrics_deep.json.
\* TLC liveness configuration for lifecycle_composition.tla.
\* See ../FORMAL_TLA_LIFECYCLE_COMPOSITION_MODEL.md for context.
\*
\* Runs LiveSpec (Spec plus fairness) and checks the Progress temporal
\* property: every held lease eventually completes and a queued
\* decommission finishes. SYMMETRY is deliberately absent: TLC's liveness
\* checking is unsound under symmetry reduction.

SPECIFICATION LiveSpec

CONSTANTS
    SignerProcs = {s1, s2, s3}
    admin       = a
    NONE        = none

CHECK_DEADLOCK FALSE

INVARIANT Safety
PROPERTY Progress
