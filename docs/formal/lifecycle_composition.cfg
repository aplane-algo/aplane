\* TLC configuration for lifecycle_composition.tla
\* See ../FORMAL_TLA_LIFECYCLE_MODEL.md for the lock model and
\* ../FORMAL_TLA_COMPOSITION_MODEL.md for the policy -> output pipeline.

SPECIFICATION Spec

CONSTANTS
    SignerProcs = {s1, s2}
    admin       = a
    NONE        = none

\* Symmetry reduction over the two signers (permuting their per-signer
\* policySigned/output/state together). Defined in the spec as SignerSymmetry.
SYMMETRY SignerSymmetry

\* Workflow-completion model: the lifecycle terminates once admin is Finished
\* and all signers are Done or Rejected, so disable the deadlock check.
CHECK_DEADLOCK FALSE

INVARIANT Safety
