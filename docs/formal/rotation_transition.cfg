SPECIFICATION Spec

CONSTANTS
    T1     = t1
    T2     = t2
    T3     = t3
    Evil   = evil
    ABSENT = absent
    Legit  = {o1, o2}

\* t1, t2, t3, evil, absent, o1, o2 are TLC model values declared above.
\* Two legitimate objects are enough: one exercises the rewrap loop, the
\* second makes partially-rewrapped states reachable, which is where the
\* crash and injection interleavings live. No symmetry over Legit: the
\* invariants quantify over all objects, so a swap is already covered.

\* The transition reaches terminal states with no enabled action (a closed
\* window with everything on the new term and divergence already recorded).
\* TLC's deadlock check would flag those; safety under crash and attacker
\* interleaving is what this model checks.
CHECK_DEADLOCK FALSE

INVARIANT Safety
