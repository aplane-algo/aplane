\* Expected failure: an unlock that answered from the session goes on to the
\* fence with nothing loaded, and when a lock came in after its check it locks
\* the signer and runs a cleanup as a loser does.
\* See ../FORMAL_TLA_KEY_USE_LOCK_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    RegisterChecksLock = TRUE
    DrainWaits = TRUE
    FinalRecheck = TRUE
    GenerationCheck = TRUE
    RecoveryEndsSession = TRUE
    UnlockWaitsForCleanup = TRUE
    LoserLocks = TRUE
    UnlockFencesRecovery = TRUE
    RecoveryReentryMovesSession = TRUE
    AnswersFromSession = TRUE
    AnswerEndsAtCheck = FALSE
    AttemptHoldsStoreLock = TRUE
    ExitsShareReading = TRUE
    MaxLocks = 2

\* Holders repeat and Unlock stays enabled, so there is no terminal state;
\* deadlock checking is disabled for uniformity with the other safety runs.
CHECK_DEADLOCK FALSE

INVARIANT KU7_AnsweredUnlockLeavesSession
