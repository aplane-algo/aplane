\* TLC liveness configuration for lifecycle.tla.
\* See ../FORMAL_TLA_LIFECYCLE_MODEL.md for context and how to run.
\*
\* Runs LiveSpec: the lifecycle transitions plus SignerRestart (recurring
\* signing operations — one-shot signers make writer starvation
\* unfalsifiable) under the fairness assumptions, checking the Progress
\* temporal property. SYMMETRY is deliberately absent: TLC's liveness
\* checking is unsound under symmetry reduction.

SPECIFICATION LiveSpec

CONSTANTS
    SignerProcs = {s1, s2}
    admin       = a
    NONE        = none

CHECK_DEADLOCK FALSE

INVARIANT Safety
PROPERTY Progress
