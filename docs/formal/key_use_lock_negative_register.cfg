\* Expected failure: a registration that ignores the lock state lands after the
\* drain began, gets a context the drain never cancels or waits for, and is
\* still holding the key when the session is cleared.
\* See ../FORMAL_TLA_KEY_USE_LOCK_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    RegisterChecksLock = FALSE
    DrainWaits = TRUE
    FinalRecheck = TRUE
    GenerationCheck = TRUE
    MaxLocks = 2

\* Holders repeat and Unlock stays enabled, so there is no terminal state;
\* deadlock checking is disabled for uniformity with the other safety runs.
CHECK_DEADLOCK FALSE

INVARIANT KU2_NoKeyMaterialAtWipe
