\* Expected failure: a recheck that reads only the current state misses a lock
\* and an unlock that both came after the sign started, and returns the signature.
\* See ../FORMAL_TLA_KEY_USE_LOCK_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    RegisterChecksLock = TRUE
    DrainWaits = TRUE
    FinalRecheck = TRUE
    GenerationCheck = FALSE
    MaxLocks = 2

\* Holders repeat and Unlock stays enabled, so there is no terminal state;
\* deadlock checking is disabled for uniformity with the other safety runs.
CHECK_DEADLOCK FALSE

INVARIANT KU1_NoSignatureAfterLock
