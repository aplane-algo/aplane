\* Expected failure: every change published before its save, the permissive
\* ones included. A signing request then sees the permissive value while the
\* file still holds the restrictive one, and keeps seeing it if the save
\* fails.
\* See ../FORMAL_TLA_SETTING_PUBLISH_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    RestrictiveFirst = TRUE
    PermissiveAfterSave = FALSE

CHECK_DEADLOCK FALSE

INVARIANT SP1_NeverMorePermissiveThanFile
