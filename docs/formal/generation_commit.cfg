\* TLC configuration for generation_commit.tla
\* See ../ARCH_GENERATIONS.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    P = gp
    C = gc

\* gp, gc are TLC model values declared above. No symmetry: the two
\* generations are not interchangeable — P is the committed parent and C
\* the incoming child, and every invariant distinguishes them.

\* The store reaches terminal states with no enabled action (a completed
\* commit with nothing left to mint, since MintStage requires current = P).
\* TLC's default deadlock check would flag those as errors; safety under
\* crash interleaving is what this model checks.
CHECK_DEADLOCK FALSE

INVARIANT Safety
