\* Expected failure: a status pass that clears the memory without the sequence
\* guard erases a release recorded after its chain read, and the next sign
\* reuses that release leaf, with every loss source off.
\* See ../FORMAL_TLA_ROTATING_LEAF_RELEASE_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    WaitForRestore = TRUE
    SeqGuard = FALSE
    AuditMayFail = FALSE
    AuditMayLose = FALSE
    RestoreMayFail = FALSE
    NLeaves = 2
    NTx = 3
    MaxStage = 2
    MaxSeq = 5

CHECK_DEADLOCK FALSE

INVARIANT LF1_NoReuseBeforeExhaustion
