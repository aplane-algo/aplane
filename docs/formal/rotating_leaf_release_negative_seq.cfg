\* Expected failure: a status pass that clears the memory without the sequence
\* guard erases a release recorded after its chain read, and the next sign
\* reuses that release leaf, with every loss source off. NextStageGuard is off
\* too: with it on, a read made before the release shows an earlier stage and
\* clears nothing, so the sequence guard alone decides nothing in this model.
\* The node does not lag here, so the read is the true chain at its time.
\* See ../FORMAL_TLA_ROTATING_LEAF_RELEASE_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    WaitForRestore = TRUE
    RecheckAtChoice = TRUE
    CutRestoreHolds = TRUE
    SeqGuard = FALSE
    NextStageGuard = FALSE
    NodeMayLag = FALSE
    RecoveryEndsSession = TRUE
    AuditMayFail = FALSE
    AuditMayLose = FALSE
    RestoreMayFail = FALSE
    NLeaves = 2
    NTx = 3
    MaxStage = 2
    MaxSeq = 5

CHECK_DEADLOCK FALSE

INVARIANT LF1_NoReuseBeforeExhaustion
