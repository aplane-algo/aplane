\* Expected failure: an entry into recovery from recovery that leaves the
\* session where it was is invisible to an unlock begun in recovery, which
\* then publishes unlocked over it.
\* See ../FORMAL_TLA_KEY_USE_LOCK_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    RegisterChecksLock = TRUE
    DrainWaits = TRUE
    FinalRecheck = TRUE
    GenerationCheck = TRUE
    RecoveryEndsSession = TRUE
    UnlockWaitsForCleanup = TRUE
    LoserLocks = TRUE
    UnlockFencesRecovery = TRUE
    RecoveryReentryMovesSession = FALSE
    AnswersFromSession = TRUE
    AnswerEndsAtCheck = TRUE
    UnlocksOneAtATime = TRUE
    LoadHoldsStoreLock = TRUE
    MaxLocks = 2

\* Holders repeat and Unlock stays enabled, so there is no terminal state;
\* deadlock checking is disabled for uniformity with the other safety runs.
CHECK_DEADLOCK FALSE

INVARIANT KU5_NoUnlockOverLaterRecovery
