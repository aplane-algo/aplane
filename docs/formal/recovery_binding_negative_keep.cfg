\* Expected failure: a failed reload that keeps the view in service whatever
\* the root selects. After a commit the root has moved off the generation the
\* view is bound to, and keeping it leaves the binding and the key cache on
\* the superseded generation outside a mutation, with signing allowed. The
\* failure rule keeps the view only while the root still selects the bound
\* generation (KeepNeedsBoundSelection); otherwise recovery's view is
\* published.
\* See ../FORMAL_TLA_RECOVERY_BINDING_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    RecoveryBindsSelection = TRUE
    KeepNeedsBoundSelection = FALSE
    MaintenanceReadsRoot = TRUE
    RecoveryBeforeRelease = TRUE

CHECK_DEADLOCK FALSE

INVARIANT RB4_BindingFollowsRoot
