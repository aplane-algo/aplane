\* Deep-bounds variant for make formal-test-deep (pre-release / scheduled
\* runs; not CI push). Metrics recorded in metrics_deep.json.
\* TLC liveness configuration for approval_coordinator.tla.
\* See ../FORMAL_TLA_APPROVAL_COORDINATOR_MODEL.md for context and how to run.
\*
\* Runs the same module under LiveSpec (Spec plus the fairness assumptions)
\* and checks the Progress temporal property. SYMMETRY is deliberately
\* absent: TLC's liveness checking is unsound under symmetry reduction, so
\* the safety config (approval_coordinator.cfg) keeps the symmetric fast
\* path and this config explores the full request permutation space. The
\* state space is small enough that this costs nothing.

SPECIFICATION LiveSpec

CONSTANTS
    Requests = {r1, r2, r3, r4}

\* Same rationale as the safety config: requests reach terminal states, so
\* the terminal state is not a deadlock.
CHECK_DEADLOCK FALSE

INVARIANT Safety
PROPERTY Progress
