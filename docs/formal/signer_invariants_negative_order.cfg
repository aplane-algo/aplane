\* Expected failure: the policy verdict before the invariants. An approving
\* rule, User Auto-Approve or the operator then releases a group that rekeys
\* an account to an aplane key that is not a valid rekey target.
\* See ../FORMAL_TLA_SIGNER_INVARIANTS_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    MaxPositions = 3
    InvariantsBeforePolicy = FALSE
    TargetJudgesEveryPosition = TRUE
    ExternalAfterPolicy = TRUE
    NetworkParamsBeforeGates = TRUE

INVARIANT SI1_NoReleaseWithInvalidRekeyTarget
