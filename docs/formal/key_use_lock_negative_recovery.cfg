\* Expected failure: recovery that leaves the lock generation where it was is
\* invisible to the final recheck once a reconcile has unlocked the signer
\* again, and the signature is returned across it.
\* See ../FORMAL_TLA_KEY_USE_LOCK_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    RegisterChecksLock = TRUE
    DrainWaits = TRUE
    FinalRecheck = TRUE
    GenerationCheck = TRUE
    RecoveryEndsSession = FALSE
    UnlockWaitsForCleanup = TRUE
    MaxLocks = 2

\* Holders repeat and Unlock stays enabled, so there is no terminal state;
\* deadlock checking is disabled for uniformity with the other safety runs.
CHECK_DEADLOCK FALSE

INVARIANT KU1_NoSignatureAfterLock
