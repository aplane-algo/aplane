\* Expected failure: a lock that clears the session without waiting for the
\* drain clears it while a holder still uses the key.
\* See ../FORMAL_TLA_KEY_USE_LOCK_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    RegisterChecksLock = TRUE
    DrainWaits = FALSE
    FinalRecheck = TRUE
    GenerationCheck = TRUE
    MaxLocks = 2

\* Holders repeat and Unlock stays enabled, so there is no terminal state;
\* deadlock checking is disabled for uniformity with the other safety runs.
CHECK_DEADLOCK FALSE

INVARIANT KU2_NoKeyMaterialAtWipe
