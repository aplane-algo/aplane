\* TLC configuration for lifecycle.tla
\* See ../FORMAL_TLA_LIFECYCLE_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    SignerProcs = {s1, s2}
    admin       = a
    NONE        = none

\* s1, s2, a, none are TLC model values declared above.

\* Symmetry reduction over the two signers. They are interchangeable
\* for the purposes of the safety invariants, so TLC can prune the
\* state space by treating any swap of s1 <-> s2 as the same state.
\* The symmetry set is defined in the spec as SignerSymmetry.
SYMMETRY SignerSymmetry

\* This is a workflow-completion model: the lifecycle naturally
\* terminates once admin reaches Finished and all signers reach Done
\* or Rejected. TLC's default deadlock check would flag that terminal
\* state as an error. Disable it; safety is what we care about here.
CHECK_DEADLOCK FALSE

INVARIANT Safety
