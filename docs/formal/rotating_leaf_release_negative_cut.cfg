\* Expected failure: a lock cuts a restore short and the signer unlocks before it
\* returns. If the restore opens the wait anyway, a sign picks from an empty memory
\* and reuses a leaf the stage already released, with every loss source off.
\* See ../FORMAL_TLA_ROTATING_LEAF_RELEASE_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    WaitForRestore = TRUE
    RecheckAtChoice = TRUE
    CutRestoreHolds = FALSE
    SeqGuard = TRUE
    AuditMayFail = FALSE
    AuditMayLose = FALSE
    RestoreMayFail = FALSE
    NLeaves = 2
    NTx = 3
    MaxStage = 2
    MaxSeq = 5

CHECK_DEADLOCK FALSE

INVARIANT LF1_NoReuseBeforeExhaustion
