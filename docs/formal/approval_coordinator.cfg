\* TLC configuration for approval_coordinator.tla
\* See ../FORMAL_APPROVAL_COORDINATOR_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    Requests = {r1, r2, r3}

\* r1, r2, r3 are TLC model values declared above.

\* Symmetry reduction over the requests. They are interchangeable for the
\* purposes of the safety invariants, so TLC can prune the state space by
\* treating any permutation as the same state. Defined in the spec as
\* RequestSymmetry.
SYMMETRY RequestSymmetry

\* This is a workflow-completion model: requests naturally reach terminal
\* states, so the system terminates and
\* TLC's default deadlock check would flag the terminal state. Disable it;
\* safety is what we check here.
CHECK_DEADLOCK FALSE

INVARIANT Safety
