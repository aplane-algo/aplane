\* Expected failure: a non-restrictive setting change skips the durable
\* SETTING_CHANGE_INTENT audit write and proceeds straight to saving.
\* A permissive value can then be saved and applied without an audit record.
\* See ../FORMAL_TLA_SETTING_PUBLISH_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    RestrictiveFirst = TRUE
    PermissiveAfterSave = TRUE
    AuditPermissiveBeforeSave = FALSE

CHECK_DEADLOCK FALSE

INVARIANT SP5_AuditDirectionRule
