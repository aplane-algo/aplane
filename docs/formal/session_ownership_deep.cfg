\* Deep-bounds variant for make formal-test-deep (pre-release / scheduled
\* runs; not CI push). Metrics recorded in metrics_deep.json.
\* TLC configuration for session_ownership.tla
\* See ../FORMAL_TLA_SESSION_OWNERSHIP_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    Sessions = {a1, a2, a3, a4}

\* a1, a2, a3 are TLC model values declared above.

\* Sessions are interchangeable for the safety invariants; TLC prunes the
\* state space by treating any permutation as the same state. Defined in
\* the spec as SessionSymmetry.
SYMMETRY SessionSymmetry

\* Sessions naturally reach Exited (and stay there), so the system
\* terminates and TLC's default deadlock check would flag the terminal
\* state. Disable it; safety is what we check here.
CHECK_DEADLOCK FALSE

INVARIANT Safety
