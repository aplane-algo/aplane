\* Expected failure: answering "pending" on a queue write that failed after
\* its rename lets a crash take the request back, so the client holds a
\* promise the node no longer has.
\* See ../FORMAL_TLA_ENROLLMENT_QUEUE_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2, k3}
    MaxPending = 2
    RequireDurableAck = FALSE

SYMMETRY KeySymmetry

CHECK_DEADLOCK FALSE

INVARIANT EQ2_PendingAckSurvivesCrash
