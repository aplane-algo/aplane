SPECIFICATION Spec

CONSTANTS
    MaxPositions = 3
    InvariantsBeforePolicy = TRUE
    TargetJudgesEveryPosition = TRUE
    ExternalAfterPolicy = FALSE

INVARIANT SI6_NoLookupForARefusedRequest
