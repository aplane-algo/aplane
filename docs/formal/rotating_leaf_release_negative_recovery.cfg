\* Expected failure: the account is absent when the restore runs, so the
\* restore skips it and opens the wait; a recovery that does not end the
\* session brings the account back with its history still missing, and the
\* next sign reuses a leaf, with every loss source off.
\* See ../FORMAL_TLA_ROTATING_LEAF_RELEASE_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    WaitForRestore = TRUE
    RecheckAtChoice = TRUE
    CutRestoreHolds = TRUE
    SeqGuard = TRUE
    NextStageGuard = TRUE
    NodeMayLag = TRUE
    RecoveryEndsSession = FALSE
    AuditMayFail = FALSE
    AuditMayLose = FALSE
    RestoreMayFail = FALSE
    NLeaves = 2
    NTx = 3
    MaxStage = 2
    MaxSeq = 5

CHECK_DEADLOCK FALSE

INVARIANT LF1_NoReuseBeforeExhaustion
