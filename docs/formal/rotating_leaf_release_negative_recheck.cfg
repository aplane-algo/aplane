\* Expected failure: a worker's Reset lands after a sign passed the wait. Without
\* the recheck at the leaf choice the sign picks from the emptied memory and
\* reuses a leaf the stage already released, with every loss source off.
\* See ../FORMAL_TLA_ROTATING_LEAF_RELEASE_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    WaitForRestore = TRUE
    RecheckAtChoice = FALSE
    SeqGuard = TRUE
    AuditMayFail = FALSE
    AuditMayLose = FALSE
    RestoreMayFail = FALSE
    NLeaves = 2
    NTx = 3
    MaxStage = 2
    MaxSeq = 5

CHECK_DEADLOCK FALSE

INVARIANT LF1_NoReuseBeforeExhaustion
