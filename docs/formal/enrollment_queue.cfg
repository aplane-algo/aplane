\* TLC configuration for enrollment_queue.tla
\* See ../FORMAL_TLA_ENROLLMENT_QUEUE_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    Keys = {k1, k2, k3}
    MaxPending = 2
    RequireDurableAck = TRUE

\* k1, k2, k3 are TLC model values declared above.

\* Keys are interchangeable for the safety invariants; TLC prunes the state
\* space by treating any permutation as the same state. Defined in the spec
\* as KeySymmetry.
SYMMETRY KeySymmetry

\* Every file can be re-published and every request answered, but the
\* system has no terminal state: an all-enrolled, empty-queue state still
\* admits Revoke. Deadlock checking is disabled for uniformity with the
\* other safety runs; safety is what we check here.
CHECK_DEADLOCK FALSE

INVARIANT Safety
