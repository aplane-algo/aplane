\* Expected failure: a restrictive change published only after its save. For
\* as long as the save takes, and for good if it fails, the permissive value
\* it was meant to replace stays in effect.
\* See ../FORMAL_TLA_SETTING_PUBLISH_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    RestrictiveFirst = FALSE
    PermissiveAfterSave = TRUE
    AuditPermissiveBeforeSave = TRUE

CHECK_DEADLOCK FALSE

INVARIANT SP3_RestrictiveInEffectDuringSave
