\* Expected failure: an unlock that compares only the lock generation
\* publishes unlocked over a recovery a store change entered while its unlock
\* function ran.
\* See ../FORMAL_TLA_KEY_USE_LOCK_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    RegisterChecksLock = TRUE
    DrainWaits = TRUE
    FinalRecheck = TRUE
    GenerationCheck = TRUE
    RecoveryEndsSession = TRUE
    UnlockWaitsForCleanup = TRUE
    LoserLocks = TRUE
    UnlockFencesRecovery = FALSE
    MaxLocks = 2

\* Holders repeat and Unlock stays enabled, so there is no terminal state;
\* deadlock checking is disabled for uniformity with the other safety runs.
CHECK_DEADLOCK FALSE

INVARIANT KU5_NoUnlockOverLaterRecovery
