\* Expected failure: a status pass that clears the memory on any other stage
\* reads a node that is behind after the release was made (so the sequence
\* guard passes), sees an earlier stage, erases the live stage's release, and
\* the next sign reuses its leaf, with every loss source off.
\* See ../FORMAL_TLA_ROTATING_LEAF_RELEASE_MODEL.md for context and how to run.

SPECIFICATION Spec

CONSTANTS
    WaitForRestore = TRUE
    RecheckAtChoice = TRUE
    CutRestoreHolds = TRUE
    SeqGuard = TRUE
    NextStageGuard = FALSE
    NodeMayLag = TRUE
    RecoveryEndsSession = TRUE
    AuditMayFail = FALSE
    AuditMayLose = FALSE
    RestoreMayFail = FALSE
    NLeaves = 2
    NTx = 3
    MaxStage = 2
    MaxSeq = 5

CHECK_DEADLOCK FALSE

INVARIANT LF1_NoReuseBeforeExhaustion
