name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Generate embedded docs
        run: make compile-docassets

      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1

      - name: Run staticcheck
        run: make staticcheck

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

      - name: Run golangci-lint
        run: make lint

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Generate embedded docs
        run: make compile-docassets

      - name: Run tests
        run: make race-cover-test

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

  contract:
    name: API Contract
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Generate embedded docs
        run: make compile-docassets

      - name: Run API contract tests
        run: make contract-test

  formal:
    name: Formal Models
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The TLC jar is vendored at .tools/tla2tools.jar (see .tools/README.md):
      # the upstream v1.8.0 release asset is re-published under the same tag,
      # so neither its URL nor a pinned checksum of it is stable. The vendored
      # jar is immutable, reviewed like any other change, and needs no
      # download step.
      - name: Run TLC
        run: make formal-test TLA2TOOLS_JAR=.tools/tla2tools.jar

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Generate embedded docs
        run: make compile-docassets

      - name: Build all packages
        run: make build-check

      - name: Compile-check testmode-tagged sources
        run: make testmode-check

  security:
    name: Security Analysis
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Generate embedded docs
        run: make compile-docassets

      - name: Run security analyzers
        run: make security-analysis
