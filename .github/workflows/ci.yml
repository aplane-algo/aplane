name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# A new push to a pull request cancels the run on the commit it replaced: that
# commit is no longer the pull request's head, so its result decides nothing.
# A run on main is never cancelled. Its group is its own commit, so pushes there
# don't share one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate embedded docs
        run: make compile-docassets

      - name: Check formatting
        run: make fmt-check

      - name: Run go vet
        run: make vet

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.2

      - name: Run staticcheck
        run: make staticcheck

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Run golangci-lint
        run: make lint

      # deadcode is not in go.sum, so setup-go's cache never holds it. Cache
      # the built binary keyed on its pinned version and the Go toolchain.
      - name: Resolve deadcode version
        id: deadcode
        run: |
          echo "version=$(make -s print-deadcode-version)" >> "$GITHUB_OUTPUT"
          echo "go=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      - name: Cache deadcode binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/aplane-deadcode/${{ steps.deadcode.outputs.version }}
          key: deadcode-${{ runner.os }}-${{ steps.deadcode.outputs.version }}-${{ steps.deadcode.outputs.go }}

      - name: Check for dead code
        run: make deadcode-check DEADCODE_BIN_DIR="$HOME/.cache/aplane-deadcode/${{ steps.deadcode.outputs.version }}"

      - name: Check that binaries without a logging handler can't log
        run: make logging-reach-check DEADCODE_BIN_DIR="$HOME/.cache/aplane-deadcode/${{ steps.deadcode.outputs.version }}"

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate embedded docs
        run: make compile-docassets

      - name: Run tests
        run: make race-cover-test

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: false

  contract:
    name: API Contract
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate embedded docs
        run: make compile-docassets

      - name: Run API contract tests
        run: make contract-test

  store:
    name: Store Lifecycle and Recovery
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run blank-store lifecycle tests
        run: make store-lifecycle-test

      - name: Run deterministic store crash tests
        run: make store-crash-test

  formal:
    name: Formal Models
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      # The TLC jar is vendored at .tools/tla2tools.jar (see .tools/README.md):
      # the upstream v1.8.0 release asset is re-published under the same tag,
      # so neither its URL nor a pinned checksum of it is stable. The vendored
      # jar is immutable, reviewed like any other change, and needs no
      # download step.
      - name: Run TLC
        run: make formal-test TLA2TOOLS_JAR=.tools/tla2tools.jar

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate embedded docs
        run: make compile-docassets

      - name: Build all packages
        run: make build-check

      - name: Compile-check testmode-tagged sources
        run: make testmode-check

  security:
    name: Security Analysis
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate embedded docs
        run: make compile-docassets

      - name: Run security analyzers
        run: make security-analysis
