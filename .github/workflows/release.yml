name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (for example, v0.6.4)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-dev musl-tools

      - name: Install zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.13.0

      - name: Build all Linux platforms
        run: make bin-amd64 bin-arm64

      - name: Build Windows client binary
        run: make bin-windows-amd64

      - name: Build Linux bundled plugins
        run: make bundled-plugins-linux

      - name: Upload Linux binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-binaries
          path: |
            bin/amd64/
            bin/arm64/
            bin/windows-amd64/

      - name: Upload Linux bundled plugins
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-plugin-binaries
          path: dist/bundled-plugins/

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true

      - name: Build macOS arm64
        run: make bin-darwin-arm64

      - name: Build macOS amd64
        run: make bin-darwin-amd64

      - name: Build macOS bundled plugins
        run: make bundled-plugins-darwin

      - name: Upload macOS binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-binaries
          path: |
            bin/darwin-amd64/
            bin/darwin-arm64/

      - name: Upload macOS bundled plugins
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-plugin-binaries
          path: dist/bundled-plugins/

  release:
    name: Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true

      - name: Download Linux binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-binaries
          path: bin/

      - name: Download macOS binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-binaries
          path: bin/

      - name: Download Linux bundled plugins
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-plugin-binaries
          path: dist/bundled-plugins/

      - name: Download macOS bundled plugins
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-plugin-binaries
          path: dist/bundled-plugins/

      - name: Restore executable bit on binaries
        run: chmod +x bin/amd64/* bin/arm64/* bin/darwin-amd64/* bin/darwin-arm64/*

      - name: Drill store lifecycle with staged release binaries
        run: make store-release-drill STORE_RELEASE_BIN_DIR="$PWD/bin/amd64"

      - name: Package release archives
        run: |
          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"
          RELEASE_VERSION="${RELEASE_TAG}"
          case "${RELEASE_VERSION}" in
            v*) ;;
            *) RELEASE_VERSION="v${RELEASE_VERSION}" ;;
          esac
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          BUILT_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p dist

          write_release_metadata() {
            local root="$1"
            cat > "${root}/release.json" <<EOF
          {
            "schema_version": 1,
            "version": "${RELEASE_VERSION}",
            "commit": "${GIT_COMMIT}",
            "built_at": "${BUILT_AT}"
          }
          EOF
          }

          write_client_readme() {
            printf '%s\n' \
              'apshell - SSH Client for APlane Signer' \
              '=====================================' \
              '' \
              'Setup:' \
              '1. Edit config.yaml and set the signer host/ports for your apsigner machine' \
              '2. Run: ./bin/apshell -d .' \
              '' \
              'First connection:' \
              '- SSH identity key will be auto-generated in .ssh/id_ed25519' \
              "- You'll be prompted to trust the server's host key (TOFU) unless known_hosts is pre-populated" \
              '- API token can be provisioned from the server via request-token' \
              '' \
              'Files:' \
              '  bin/apshell       - General shell client' \
              '  bin/aprekey - External Falcon contract-admin helper' \
              '  config.yaml       - Configuration template (edit signer host/ports)' \
              '  .ssh/             - SSH keys and known_hosts (created/managed locally)' \
              '  installer/scripts/config-mcp.sh - Optional helper to write .mcp.json after extraction' \
              '  aplane.token      - API token (created after request-token or copied from operator)' \
              > dist/staging/aplane-client/README.txt
          }

          write_client_readme_windows() {
            printf '%s\r\n' \
              'apshell - SSH Client for APlane Signer' \
              '=====================================' \
              '' \
              'Setup:' \
              '1. Edit config.yaml and set the signer host/ports for your apsigner machine' \
              '2. Run: bin\apshell.exe -d .' \
              '' \
              'First connection:' \
              '- SSH identity key will be auto-generated in .ssh\id_ed25519' \
              "- You'll be prompted to trust the server's host key (TOFU) unless known_hosts is pre-populated" \
              '- API token can be provisioned from the server via request-token' \
              '' \
              'Files:' \
              '  bin\apshell.exe   - General shell client' \
              '  config.yaml       - Configuration template (edit signer host/ports)' \
              '  .ssh\             - SSH keys and known_hosts (created/managed locally)' \
              '  aplane.token      - API token (created after request-token or copied from operator)' \
              > dist/staging/aplane-client/README.txt
          }

          # Linux archives (structured tarball with installer helper scripts)
          for arch in amd64 arm64; do
            archive="aplane_${VERSION}_linux_${arch}.tar.gz"
            rm -rf dist/staging
            mkdir -p dist/staging/aplane/{bin,installer/scripts,library/templates,plugins.available}
            cp bin/${arch}/apshell bin/${arch}/aprekey bin/${arch}/apsigner bin/${arch}/apadmin \
               bin/${arch}/apconsole \
               bin/${arch}/apapprover bin/${arch}/apstore bin/${arch}/appass \
               bin/${arch}/aplocalnet \
               bin/${arch}/appass-file \
               bin/${arch}/appass-systemd-creds \
               bin/${arch}/approbe \
               bin/${arch}/applugin-checksum dist/staging/aplane/bin/
            cp installer/apsigner.service installer/apsigner.service.template \
               installer/sudoers.template \
               dist/staging/aplane/installer/
            cp installer/scripts/systemd-setup.sh installer/scripts/aplane-env-audit.sh installer/scripts/config-mcp.sh dist/staging/aplane/installer/scripts/
            cp library/templates/README.md library/templates/*.yaml dist/staging/aplane/library/templates/
            scripts/stage-bundled-plugins.sh --os linux --arch "${arch}" dist/staging/aplane/plugins.available
            cp install.sh uninstall.sh dist/staging/aplane/
            write_release_metadata dist/staging/aplane
            tar -czf "dist/${archive}" -C dist/staging aplane
            echo "Created dist/${archive}"
          done
          rm -rf dist/staging

          # Linux client-only archives
          for arch in amd64 arm64; do
            archive="aplane-client_${VERSION}_linux_${arch}.tar.gz"
            rm -rf dist/staging
            mkdir -p dist/staging/aplane-client/{bin,.ssh,installer/scripts}
            cp bin/${arch}/apshell bin/${arch}/aprekey dist/staging/aplane-client/bin/
            cp examples/config/apclient/config.yaml.example dist/staging/aplane-client/config.yaml
            cp installer/scripts/config-mcp.sh dist/staging/aplane-client/installer/scripts/
            write_client_readme
            write_release_metadata dist/staging/aplane-client
            tar -czf "dist/${archive}" -C dist/staging aplane-client
            echo "Created dist/${archive}"
          done
          rm -rf dist/staging

          # macOS archives (structured — no systemd files)
          for arch in amd64 arm64; do
            archive="aplane_${VERSION}_darwin_${arch}.tar.gz"
            rm -rf dist/staging
            mkdir -p dist/staging/aplane/{bin,installer/scripts,library/templates,plugins.available}
            cp bin/darwin-${arch}/apshell bin/darwin-${arch}/aprekey bin/darwin-${arch}/apsigner \
               bin/darwin-${arch}/apadmin bin/darwin-${arch}/apconsole \
               bin/darwin-${arch}/apapprover \
               bin/darwin-${arch}/apstore bin/darwin-${arch}/appass \
               bin/darwin-${arch}/aplocalnet \
               bin/darwin-${arch}/appass-file \
               bin/darwin-${arch}/approbe \
               bin/darwin-${arch}/applugin-checksum dist/staging/aplane/bin/
            cp library/templates/README.md library/templates/*.yaml dist/staging/aplane/library/templates/
            cp installer/scripts/aplane-env-audit.sh installer/scripts/config-mcp.sh dist/staging/aplane/installer/scripts/
            scripts/stage-bundled-plugins.sh --os darwin --arch "${arch}" dist/staging/aplane/plugins.available
            cp install.sh uninstall.sh dist/staging/aplane/
            write_release_metadata dist/staging/aplane
            tar -czf "dist/${archive}" -C dist/staging aplane
            echo "Created dist/${archive}"
          done

          # macOS client-only archives
          for arch in amd64 arm64; do
            archive="aplane-client_${VERSION}_darwin_${arch}.tar.gz"
            rm -rf dist/staging
            mkdir -p dist/staging/aplane-client/{bin,.ssh,installer/scripts}
            cp bin/darwin-${arch}/apshell bin/darwin-${arch}/aprekey dist/staging/aplane-client/bin/
            cp examples/config/apclient/config.yaml.example dist/staging/aplane-client/config.yaml
            cp installer/scripts/config-mcp.sh dist/staging/aplane-client/installer/scripts/
            write_client_readme
            write_release_metadata dist/staging/aplane-client
            tar -czf "dist/${archive}" -C dist/staging aplane-client
            echo "Created dist/${archive}"
          done

          # Windows client-only archive (zip; apshell is the only Windows binary)
          archive="aplane-client_${VERSION}_windows_amd64.zip"
          rm -rf dist/staging
          mkdir -p dist/staging/aplane-client/{bin,.ssh}
          cp bin/windows-amd64/apshell.exe dist/staging/aplane-client/bin/
          cp examples/config/apclient/config.yaml.example dist/staging/aplane-client/config.yaml
          write_client_readme_windows
          write_release_metadata dist/staging/aplane-client
          (cd dist/staging && zip -qr "../${archive}" aplane-client)
          echo "Created dist/${archive}"
          rm -rf dist/staging

          # Generate checksums
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cd ..
          echo "Generated dist/checksums.txt"
          cat dist/checksums.txt

      - name: Install minisign
        run: go install aead.dev/minisign/cmd/minisign@v0.3.0

      - name: Sign checksums
        run: |
          umask 077
          key_file="$(mktemp "${RUNNER_TEMP}/minisign.XXXXXX")"
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key_file"
          unset MINISIGN_SECRET_KEY
          minisign -S -W -s "$key_file" -m dist/checksums.txt
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_KEY }}

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG}" > dist/changelog.md
            echo "" >> dist/changelog.md
            git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" >> dist/changelog.md
          else
            echo "## Initial release" > dist/changelog.md
          fi

      - name: Delete existing release if present
        run: gh release delete "${RELEASE_TAG}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file dist/changelog.md \
            dist/*.tar.gz \
            dist/*.zip \
            dist/checksums.txt \
            dist/checksums.txt.minisig
        env:
          GH_TOKEN: ${{ github.token }}
