schema_version: 1
derivation_version: 2
template_type: generic
template_mode: generated
publisher: aplane
family: timelock
version: 1
display_name: "Timelock"
description: "Restrict funds (ALGO or ASA) to recipient after specified round"
display_color: "35"

parameters:
  - name: recipient
    label: "Recipient Address"
    description: "Algorand address that can receive funds after unlock"
    type: address
    required: true
    max_length: 58
    placeholder: "Enter recipient address"

  - name: unlock_round
    label: "Unlock Round"
    description: "Round number after which funds can be withdrawn"
    type: uint64
    required: true
    max_length: 20
    placeholder: "Enter unlock round number"
  - name: allowed_optin_assets
    label: "Approved Opt-In Assets"
    description: "Optional list of ASA IDs this LogicSig may opt into via zero-amount self-transfer"
    type: uint64[]
    required: false
    min_items: 1
    max_items: 16
    placeholder: "10458941,31566704"

teal: |
  #pragma version 10

  // Timelock: funds (ALGO or ASA) locked until round @unlock_round, then only to @recipient

  // Strict fee cap: public generic LogicSigs must not carry variable fee liability.
  // If higher total fees are ever needed, use explicit external sponsorship in a
  // tightly controlled atomic group rather than loosening this escrow fee.
  txn Fee
  int 1000
  ==
  assert

  // Security: Prevent RekeyTo takeover
  txn RekeyTo
  global ZeroAddress
  ==
  assert

  // Check transaction type is payment or asset transfer
  txn TypeEnum
  int pay
  ==
  txn TypeEnum
  int axfer
  ==
  ||
  assert

  // Approved ASA opt-in remains available before unlock so the escrow can be
  // prepared to receive specific assets without weakening spend restrictions.
  txn TypeEnum
  int axfer
  ==
  bnz maybe_optin

  continue_checks:
  // Check 1: Transaction first valid round >= unlock round
  // (Transaction cannot be submitted until network reaches this round)
  txn FirstValid
  int @unlock_round
  >=
  assert

  // Branch on transaction type for field checks
  txn TypeEnum
  int pay
  ==
  bnz pay_path

  // --- asset transfer path ---
  txn AssetSender
  global ZeroAddress
  ==
  assert

  txn AssetAmount
  int 0
  ==
  txn AssetReceiver
  txn Sender
  ==
  &&
  bnz maybe_optin

  txn AssetReceiver
  addr @recipient
  ==
  assert

  txn AssetCloseTo
  addr @recipient
  ==
  txn AssetCloseTo
  global ZeroAddress
  ==
  ||
  assert

  int 1
  return

  maybe_optin:
  txn AssetSender
  global ZeroAddress
  ==
  assert
  txn AssetAmount
  int 0
  ==
  txn AssetReceiver
  txn Sender
  ==
  &&
  bz continue_checks
  txn AssetCloseTo
  global ZeroAddress
  ==
  assert
  {{range @allowed_optin_assets}}
  txn XferAsset
  int {{.}}
  ==
  bnz allow_optin
  {{end}}
  err

  allow_optin:
  int 1
  return

  // --- payment path ---
  pay_path:
      txn Receiver
      addr @recipient
      ==
      assert

      txn CloseRemainderTo
      addr @recipient
      ==
      txn CloseRemainderTo
      global ZeroAddress
      ==
      ||
      assert

      int 1
      return
