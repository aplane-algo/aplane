schema_version: 2
derivation_version: 2
template_type: composed
base_key_type: aplane.falcon1024.v1
template_mode: strict
publisher: aplane
family: falcon1024-hashlock
version: 1
display_name: "Falcon-1024 Hashlock"
description: "Falcon-1024 signature with SHA256 hash verification"

bounded:
  contract: bounded1
  spend_effects: [pay, axfer, asset_opt_in]
  max_fee: 10000
  admin_operations:
    - kind: rekey
      authorization: spending_key
      policy_gate: layer3
  runtime_args:
    - name: preimage
      label: "Secret Preimage"
      description: "The secret value whose SHA256 hash matches the stored hash"
      type: bytes
      max_size: 64
      required_on: [spend, rekey]

parameters:
  - name: hash
    label: "SHA256 Hash"
    description: "SHA256 hash of the secret preimage (64 hex characters)"
    type: bytes
    required: true
    max_length: 64
    input_modes:
      - name: preimage
        label: "Secret Preimage"
        transform: sha256
        input_type: string
      - name: hash
        label: "SHA256 Hash"
    example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
    placeholder: "Enter secret preimage"

template_variables:
  - name: hash
    source: parameter
    parameter: hash
    type: bytes
    constant: byte

teal: |
  // Hash verification: sha256(arg 1) == stored hash
  arg 1
  sha256
  $hash
  ==
  assert
