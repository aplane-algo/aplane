schema_version: 1
derivation_version: 3
template_mode: generated
publisher: aplane
family: htlc
version: 1
display_name: "HTLC"
description: "Hash time-locked ALGO contract: recipient claims all with the preimage before timeout, refund address reclaims all after"
display_color: "36"
max_opcode_cost: 20000
# Not a valid rekey target: the program never checks Sender, forbids every
# rekey, and allows only a payment that closes the whole balance to the
# recipient (with the preimage) or the refund address (after timeout_round).
# An account rekeyed to an HTLC account would be closed by whoever satisfies
# the program, and could never be rekeyed away.
valid_rekey_target: false

parameters:
  - name: hash
    label: "Hash (SHA256)"
    description: "SHA256 hash of the secret preimage (64 hex characters)"
    type: bytes
    required: true
    max_length: 64
    input_modes:
      - name: preimage
        label: "Preimage"
        transform: sha256
        input_type: string
      - name: hash
        label: "Hash (SHA256)"
    example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
    placeholder: "Enter secret preimage"
  - name: recipient
    label: "Recipient Address"
    description: "Address that can claim funds by providing the preimage"
    type: address
    required: true
    nonzero: true
    example: "EIRCEIRCEIRCEIRCEIRCEIRCEIRCEIRCEIRCEIRCEIRCEIRCEIRDOHSEZI"
  - name: refund_address
    label: "Refund Address"
    description: "Address that can reclaim funds after timeout"
    type: address
    required: true
    nonzero: true
    example: "CEIRCEIRCEIRCEIRCEIRCEIRCEIRCEIRCEIRCEIRCEIRCEIRCEI7JH2AYM"
  - name: timeout_round
    label: "Timeout Round"
    description: "First round a refund can start; a claim must be finished before this round"
    type: uint64
    required: true
    min: 1
    example: "50000000"

runtime_args:
  - name: preimage
    label: "Preimage"
    description: "The secret that hashes to the stored hash, up to 64 bytes"
    type: bytes
    required: false
    byte_length: 0
    max_size: 64

teal: |
  #pragma version 13

  // HTLC LogicSig - ALGO only, with two all-or-nothing paths:
  // 1. Claim: before timeout, arg 0 is the preimage and the balance closes to recipient.
  // 2. Refund: after timeout, with no arg, the balance closes to refund_address.
  // Both paths need no signature, so anyone may submit them. Requiring the close-out
  // makes each path single-use: a repeatable partial payment would let anyone burn
  // the balance in fees once the preimage is public or the timeout has passed.

  // Fee ceiling, not an exact fee, so a higher network minimum cannot strand funds.
  // A path runs once, so the most a third party can waste is this one fee.
  txn Fee
  int 10000
  <=
  assert

  // Security: Prevent rekey attacks
  txn RekeyTo
  global ZeroAddress
  ==
  assert

  // ALGO payments only
  txn TypeEnum
  int pay
  ==
  assert

  // A zero CloseRemainderTo means no close-out, so a path comparing it to a zero
  // destination would pass without closing the account. Creation rejects a zero
  // destination; this keeps the single-use guarantee in the program itself.
  txn CloseRemainderTo
  global ZeroAddress
  !=
  assert

  // Claim and refund windows never overlap: a refund starts at timeout_round, and a
  // claim must expire before it, so a backdated claim cannot land after the timeout.
  txn FirstValid
  int @timeout_round
  >=
  bnz refund_path

  // === CLAIM PATH (before timeout) ===
  txn LastValid
  int @timeout_round
  <
  assert

  // Verify SHA256(preimage) == stored hash
  // Note: If no arg is provided, this fails because arg 0 does not exist.
  arg 0
  sha256
  byte @hash
  ==
  assert

  txn Receiver
  addr @recipient
  ==
  assert

  txn CloseRemainderTo
  addr @recipient
  ==
  assert

  int 1
  return

  // === REFUND PATH (after timeout) ===
  refund_path:
  txn Receiver
  addr @refund_address
  ==
  assert

  txn CloseRemainderTo
  addr @refund_address
  ==
  assert

  int 1
  return
